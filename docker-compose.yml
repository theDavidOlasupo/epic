services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: alpaca-postgres
    environment:
      POSTGRES_USER: alpaca
      POSTGRES_PASSWORD: alpaca
      POSTGRES_DB: alpaca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpaca -d alpaca"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: alpaca-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI at http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
